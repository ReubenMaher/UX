<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Header breakpoint viewer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Open+Sans:wght@400;600&display=swap">
<style>
:root{--bg:#f4f6f9;--sf:#fff;--ink:#1c2430;--mute:#5a6575;--line:#d3dae3;--ac:#013383;
--dark:#020304;--light:#fdfdff;--eye:#013383;--brand:#012969;--sub:#5e5e5e;--p300:#013383;--p100:#001f4f;--btn2:#d4e3f3;
--text-title:1.125rem;--text-section:.75rem;--text-heading:.92rem;--text-label:.82rem;--text-option:.8rem;--text-meta:.72rem;
--hf:Montserrat,"Segoe UI",Arial,sans-serif;--bf:"Open Sans","Segoe UI",Arial,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--sf:#1a2029;--ink:#e8ecf1;--mute:#9aa5b4;--line:#2d3744;--ac:#7fb0ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161c;--sf:#1a2029;--ink:#e8ecf1;--mute:#9aa5b4;--line:#2d3744;--ac:#7fb0ff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.app-shell{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:100vh;transition:grid-template-columns .22s ease}
.bar{position:sticky;top:0;z-index:20;align-self:start;height:100vh;overflow:auto;background:var(--sf);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:14px;box-shadow:4px 0 16px rgba(18,28,42,.06);transition:padding .22s ease}
#controls-panel{display:flex;flex:1;min-height:0;flex-direction:column}
.sidebar-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 2px 12px;border-bottom:1px solid var(--line)}
.sidebar-title{margin:0;color:var(--ink);font-size:var(--text-title);font-weight:700;line-height:1.3;white-space:nowrap}
.sidebar-toggle{width:36px;min-width:36px;padding:0;display:grid;place-items:center}
.sidebar-toggle-icon{width:9px;height:9px;border-top:2px solid currentColor;border-right:2px solid currentColor;transform:rotate(-135deg);transition:transform .2s ease}
.sidebar-collapsed{grid-template-columns:64px minmax(0,1fr)}
.sidebar-collapsed .bar{padding:16px 8px}
.sidebar-collapsed .sidebar-head{justify-content:center;padding-inline:0}
.sidebar-collapsed .sidebar-title,.sidebar-collapsed .controls,.sidebar-collapsed .viewport-controls,.sidebar-collapsed #info{display:none}
.sidebar-collapsed .sidebar-toggle-icon{transform:rotate(45deg)}
.controls{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.controls[hidden]{display:none}
#controls-panel{gap:12px}
.editor-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;border:1px solid var(--line);border-radius:10px;background:#edf0f4}
.editor-tabs button{min-width:0;min-height:38px;border:0;background:transparent;color:var(--mute);font-size:var(--text-option);font-weight:600}
.editor-tabs button[aria-selected=true]{background:var(--sf);color:var(--ink);box-shadow:0 1px 3px rgba(18,28,42,.12)}
#info{margin-top:auto;padding-top:14px}
.group{min-width:0;border:1px solid #e3e7ed;border-radius:10px;background:#fff;padding:12px}
.group-title{margin:0 0 10px;color:var(--ink);font-size:.9rem;font-weight:600;letter-spacing:0;text-transform:none}
.r{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.r+.r{margin-top:8px}
.layout-controls{display:grid;gap:12px}
.seg.header-type,.seg.breakpoint-options{display:grid;width:100%;grid-template-columns:repeat(2,minmax(0,1fr))}
.header-type button{white-space:nowrap}
.header-type{display:grid;width:100%;grid-template-columns:repeat(2,minmax(0,1fr))}
.layout-field{display:grid;gap:4px;color:var(--mute);font-size:var(--text-label);font-weight:600}
.layout-field select{width:100%;min-width:0}
.layout-width{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:var(--text-option);font-weight:600}
.layout-width input[type=number]{margin-left:auto}
.breakpoint-field{display:grid;gap:5px}
.seg.breakpoint-options{grid-template-columns:repeat(3,minmax(0,1fr))}
.breakpoint-options button{min-width:0;padding-inline:4px;white-space:nowrap;font-size:var(--text-option);font-weight:500}
.appearance-toggles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px}
.appearance-toggles label{min-width:0;min-height:36px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--sf);font-size:var(--text-option);font-weight:500}
.appearance-toggles input{flex:none;accent-color:var(--ac)}
.appearance-fields{display:grid;gap:16px}
.appearance-field{display:grid;gap:5px;color:var(--mute);font-size:var(--text-label);font-weight:600}
.appearance-field .seg{display:grid;width:100%;grid-template-columns:repeat(3,minmax(0,1fr))}
.appearance-field--title .seg{grid-template-columns:repeat(2,minmax(0,1fr))}
.appearance-field .seg button{min-width:0;padding-inline:4px;font-size:var(--text-option);font-weight:500}
.content-toggles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.content-toggles label{min-width:0;min-height:36px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--sf);font-size:var(--text-option);font-weight:500}
.content-toggles input{flex:none;accent-color:var(--ac)}
.image-controls{display:grid;gap:16px}
.image-uploads{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.image-field{display:grid;align-content:start;gap:8px;min-width:0;padding:10px;border:1px solid #e3e7ed;border-radius:8px;background:#fff;color:var(--ink);font-size:var(--text-option);font-weight:600}
.image-field input[type=file]{width:100%;min-width:0;font-size:var(--text-meta);font-weight:400}
.reset-actions{display:flex;justify-content:flex-end}
.text-link{min-height:auto;padding:2px 0;border:0;background:transparent;color:var(--ac);font-size:var(--text-option);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.text-link:hover{background:transparent;color:var(--brand)}
.image-controls #rs{width:100%}
.nav-controls{gap:10px}
.nav-layout-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%;border:0;overflow:visible}
.nav-layout-options button{display:grid;align-content:start;gap:4px;min-width:0;min-height:70px;padding:10px;border:1px solid #e3e7ed;border-radius:8px;background:#fff;color:var(--ink);text-align:left;font-size:var(--text-option);font-weight:600}
.nav-layout-options button[aria-pressed=true]{border-color:var(--ac);background:#f2f6fc;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ac)}
.nav-layout-options button span{color:var(--mute);font-size:var(--text-meta);font-weight:400;line-height:1.35}
.nav-control-fields{display:grid;gap:12px}
.nav-control-fields>label:not(.nav-check),.nav-item-label{display:grid;gap:5px;color:var(--mute);font-size:var(--text-label);font-weight:600}
.nav-control-fields input[type=text],.nav-item-label input[type=text]{width:100%;min-width:0;cursor:text}
.nav-check{display:flex!important;flex-direction:row;align-items:center;justify-content:space-between;gap:10px;min-height:38px;color:var(--ink);font-size:var(--text-option);font-weight:500}
.nav-check input,.nav-item-row>label input[type=checkbox]{appearance:none;position:relative;flex:0 0 auto;width:34px;height:20px;margin:0;border:0;border-radius:999px;background:#d8dde5;cursor:pointer;transition:background .16s ease}
.nav-check input::after,.nav-item-row>label input[type=checkbox]::after{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.18);content:"";transition:transform .16s ease}
.nav-check input:checked,.nav-item-row>label input[type=checkbox]:checked{background:var(--ac)}
.nav-check input:checked::after,.nav-item-row>label input[type=checkbox]:checked::after{transform:translateX(14px)}
.nav-check input:focus-visible,.nav-item-row>label input[type=checkbox]:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.nav-items-editor{display:grid;gap:10px}
.nav-item-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px}
.nav-item-row>.nav-item-label{display:grid;align-items:start;gap:5px;color:var(--ink);font-size:var(--text-option);white-space:normal}
.nav-item-row>label{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:var(--text-meta);white-space:nowrap}
.nav-item-row>label input[type=checkbox]{width:30px;height:18px}
.nav-item-row>label input[type=checkbox]::after{width:14px;height:14px}
.nav-item-row>label input[type=checkbox]:checked::after{transform:translateX(12px)}
.group details summary{display:flex;align-items:center;gap:8px;min-height:24px;color:var(--ink);font-size:var(--text-heading);font-weight:600;line-height:1.3;cursor:pointer;list-style:none}
.group details summary::-webkit-details-marker{display:none}
.group details summary::before{content:"+";display:grid;place-items:center;width:18px;height:18px;border:1px solid var(--line);border-radius:5px;color:var(--mute);font-size:14px;line-height:1}
.group details[open] summary::before{content:"−"}
.group details[open] .group-content{padding-top:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0}
button,select,input[type=number]{font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--line);border-radius:6px;padding:5px 10px;min-height:34px;cursor:pointer}
button[aria-pressed=true]{background:var(--ac);color:#fff;border-color:var(--ac)}
input[type=number]{width:84px;cursor:text}
label{display:inline-flex;gap:5px;align-items:center;color:var(--mute);font-size:var(--text-label)}
.header-type button{font-size:var(--text-heading);font-weight:600}
.layout-field select,.layout-width input[type=number]{font-size:var(--text-option);font-weight:400}
.breakpoint-field>.info{font-size:var(--text-label);font-weight:600}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.info{font-size:var(--text-meta);color:var(--mute)}
@media(max-width:760px){
  .app-shell,.sidebar-collapsed{grid-template-columns:0 minmax(0,1fr)}
  .bar,.sidebar-collapsed .bar{position:fixed;left:0;top:env(safe-area-inset-top,0px);bottom:0;width:min(88vw,320px);height:auto;padding:12px;transform:translateX(0);transition:transform .22s ease}
  .sidebar-collapsed .bar{width:64px;padding:12px 8px;transform:translateX(0)}
  .sidebar-collapsed .sidebar-title,.sidebar-collapsed .controls,.sidebar-collapsed .viewport-controls,.sidebar-collapsed #info{display:none}
  #stage{grid-column:2;min-width:0;padding:24px 16px 40px}
}
@media(max-width:600px){.r{gap:8px}}
#stage{min-width:0;padding:28px 24px 40px}
#wrap{position:relative;margin:0 auto}
#vp{display:flex;flex-direction:column;transform-origin:top left;box-shadow:0 0 0 1px var(--line);background:#fff;position:relative;overflow:hidden}
.h{position:absolute;top:0;bottom:0;width:14px;cursor:ew-resize;touch-action:none;background:var(--line);border-radius:7px;opacity:.8}
.h::after{content:"";position:absolute;left:5px;right:5px;top:calc(50% - 18px);height:36px;background:var(--mute);border-radius:2px}
.comp{position:relative;overflow:hidden;font-family:var(--bf)}
.rest{background:repeating-linear-gradient(135deg,#eef1f5 0 12px,#f6f8fa 12px 24px);color:#8a95a5;font:14px var(--bf);display:flex;align-items:center;justify-content:center}
.a{position:relative;display:flex;align-items:center}
.img{position:absolute;background-size:cover;background-position:center;background-repeat:no-repeat}
.ov{position:absolute;inset:0;background:rgba(2,3,4,.6)}
.ct{display:flex;flex-direction:column;gap:32px;width:100%}
.stk{display:flex;flex-direction:column;gap:16px}
.btns{display:flex;gap:16px}
.e{font:600 12px/18px var(--bf);letter-spacing:.3em;text-transform:uppercase}
.l{font:700 24px/32px var(--hf)}.t{font:700 64px/80px var(--hf)}.s{font:700 32px/40px var(--hf)}
.t.h1{font-size:48px;line-height:64px;letter-spacing:0}
.d{font:400 16px/24px var(--bf)}.f{font:400 12px/18px var(--bf)}
.b{font:600 16px/24px var(--bf);padding:12px 24px;border-radius:8px}
.b1{background:var(--p300);color:var(--light)}.b2{background:var(--btn2);color:var(--brand)}
[contenteditable]{outline-offset:3px}
.grid{position:absolute;top:0;pointer-events:none;z-index:6;display:grid;grid-template-columns:repeat(12,1fr);gap:24px}
.grid i{background:rgba(255,0,0,.1)}
.navigation{position:relative;z-index:2;flex:0 0 auto;width:100%;background:var(--light);color:var(--dark);font-family:var(--bf)}
.navigation-inner{display:flex;align-items:center;gap:16px;width:100%;height:80px}
.navigation-brand{display:flex;flex:0 0 auto;align-items:center;gap:8px;min-width:0}
.navigation-logo{display:block;width:128px;height:48px;object-fit:contain}
.navigation-brand-label{max-width:136px;font:400 10px/12px var(--bf);color:#020304}
.navigation-links-area{display:flex;flex:1;justify-content:center;min-width:0}
.navigation-links{display:flex;flex:0 0 auto;align-items:center;gap:32px;white-space:nowrap}
.navigation-link{font:400 14px/20px var(--bf);color:#020304}
.navigation[data-layout=grid] .navigation-links{width:100%;min-width:0;flex:1;gap:0}
.navigation[data-layout=grid] .navigation-link{display:-webkit-box;flex:1 1 0;min-width:0;overflow:hidden;text-align:center;white-space:normal;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.navigation-actions{display:flex;flex:0 0 auto;align-items:center;gap:8px}
.navigation .navigation-primary,.navigation .navigation-menu-toggle{min-width:44px;min-height:44px;padding:0 16px;border:0;border-radius:8px;background:#006cff;color:#fdfdff;font:600 14px/20px var(--bf);white-space:nowrap}
.navigation .navigation-primary{display:grid;place-items:center}
.navigation .navigation-secondary{display:grid;place-items:center;min-width:44px;min-height:44px;padding:0 16px;border:0;border-radius:8px;background:#e5f0ff;color:#0056cc;font:600 14px/20px var(--bf);white-space:nowrap}
.navigation .navigation-menu-toggle{display:grid;width:44px;padding:0;background:transparent;color:#020304;visibility:hidden}
.navigation.is-menu .navigation-menu-toggle{visibility:visible}
.navigation-menu-icon,.navigation-menu-icon::before,.navigation-menu-icon::after{display:block;width:20px;height:2px;background:currentColor}
.navigation-menu-icon{position:relative}
.navigation-menu-icon::before,.navigation-menu-icon::after{position:absolute;left:0;content:""}
.navigation-menu-icon::before{top:-6px}.navigation-menu-icon::after{top:6px}
.navigation.is-menu .navigation-links-area{visibility:hidden}
.navigation.is-menu .navigation-menu-toggle{display:grid;place-items:center}
.navigation-menu{position:absolute;top:100%;right:0;z-index:3;display:grid;min-width:220px;padding:8px;border:1px solid #d3dae3;border-radius:0 0 8px 8px;background:#fdfdff;box-shadow:0 8px 20px rgba(18,28,42,.16)}
.navigation-menu[hidden]{display:none}
.navigation-menu-item{padding:10px 12px;color:#020304;font:400 14px/20px var(--bf);text-align:left}
</style>
</head>
<body>
<div class="app-shell" id="app-shell">
<aside class="bar" id="sidebar" aria-label="Header and navigation editor controls">
  <div class="sidebar-head">
    <h1 class="sidebar-title">Header controls</h1>
    <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="Minimise controls" aria-expanded="true" aria-controls="controls-panel" title="Minimise controls"><span class="sidebar-toggle-icon" aria-hidden="true"></span></button>
  </div>
  <div id="controls-panel">
  <section class="group viewport-controls" aria-labelledby="viewport-title">
    <h2 class="group-title" id="viewport-title">Viewport</h2>
    <div class="layout-controls">
      <label class="layout-width">Viewport width <input id="w" type="number" min="1008" max="2560" step="1"> px</label>
      <div class="breakpoint-field">
        <span class="info">Breakpoints</span>
        <div class="seg breakpoint-options" role="group" aria-label="Breakpoints"><button data-w="1024">Small</button><button data-w="1280">Medium</button><button data-w="1920">XL</button></div>
      </div>
    </div>
  </section>
  <div class="editor-tabs" role="tablist" aria-label="Editor sections">
    <button id="header-tab" type="button" role="tab" aria-selected="true" aria-controls="header-controls">Header</button>
    <button id="navigation-tab" type="button" role="tab" aria-selected="false" aria-controls="navigation-controls" tabindex="-1">Navigation</button>
  </div>
  <div class="controls" id="header-controls" role="tabpanel" aria-labelledby="header-tab">
    <section class="group header-settings" aria-labelledby="layout-title">
      <h2 class="group-title" id="layout-title">Header</h2>
      <div class="layout-controls">
        <div class="seg header-type" role="group" aria-label="Header type"><button id="gp" aria-pressed="true">Primary</button><button id="gs" aria-pressed="false">Secondary</button></div>
        <label class="layout-field">Variant <select id="vs"></select></label>
      </div>
    </section>
    <section class="group group--appearance">
      <details>
        <summary>Appearance</summary>
        <div class="group-content">
          <div class="r appearance-toggles">
            <label><input type="checkbox" id="grid"> Grid</label>
            <label><input type="checkbox" id="ov" checked> Overlay</label>
            <label id="sslab"><input type="checkbox" id="ss" checked> Side image</label>
          </div>
          <div class="appearance-fields">
            <div class="appearance-field">
              <span>Text colour</span>
              <div class="seg" role="group" aria-label="Text colour"><button data-tc="auto" aria-pressed="true">Default</button><button data-tc="white" aria-pressed="false">White</button><button data-tc="black" aria-pressed="false">Black</button></div>
            </div>
            <div class="appearance-field appearance-field--title">
              <span>Title style</span>
              <div class="seg" role="group" aria-label="Title style"><button data-ts="hero" aria-pressed="true">Hero</button><button data-ts="h1" aria-pressed="false">H1</button></div>
            </div>
          </div>
        </div>
      </details>
    </section>
    <section class="group">
      <details>
        <summary>Visible content</summary>
        <div class="group-content"><div class="r content-toggles" id="tg"></div></div>
      </details>
    </section>
    <section class="group">
      <details>
        <summary>Images</summary>
        <div class="group-content">
          <div class="image-controls">
            <div class="image-uploads">
              <label class="image-field">Background image <input type="file" id="fb" accept="image/*"></label>
              <label class="image-field">Side image <input type="file" id="fs" accept="image/*"></label>
            </div>
          </div>
        </div>
      </details>
    </section>
    <div class="reset-actions"><button class="text-link" id="reset-all" type="button">Reset all</button></div>
  </div>
  <div class="controls nav-controls" id="navigation-controls" role="tabpanel" aria-labelledby="navigation-tab" hidden>
    <section class="group" aria-labelledby="navigation-layout-title">
      <h2 class="group-title" id="navigation-layout-title">Navigation layout</h2>
      <div class="seg nav-layout-options" role="group" aria-label="Navigation layout">
        <button type="button" data-nav-layout="grid" aria-pressed="true">Grid<span>Centered, evenly spaced links</span></button>
        <button type="button" data-nav-layout="adaptive" aria-pressed="false">Adaptive<span>Switches to a menu when links don’t fit</span></button>
      </div>
    </section>
    <section class="group" aria-labelledby="navigation-logo-title">
      <h2 class="group-title" id="navigation-logo-title">Logo</h2>
      <div class="nav-control-fields">
        <label class="image-field">Logo image <input type="file" id="nav-logo-upload" accept="image/*"></label>
        <label class="nav-check"><span>Show logo image</span><input type="checkbox" id="nav-logo-visible" checked></label>
        <label>Generic logo text <input type="text" id="nav-brand-label" value="alpha1-proteinase inhibitor (human)"></label>
        <label class="nav-check"><span>Show generic text</span><input type="checkbox" id="nav-brand-visible" checked></label>
      </div>
    </section>
    <section class="group" aria-labelledby="navigation-items-title">
      <h2 class="group-title" id="navigation-items-title">Navigation items</h2>
      <div class="nav-items-editor" id="nav-items-editor"></div>
    </section>
    <section class="group" aria-labelledby="navigation-actions-title">
      <h2 class="group-title" id="navigation-actions-title">Buttons</h2>
      <div class="nav-control-fields">
        <label class="nav-check"><span>Primary button</span><input type="checkbox" id="nav-primary-visible" checked></label>
        <label class="nav-check"><span>Secondary button</span><input type="checkbox" id="nav-secondary-visible"></label>
      </div>
    </section>
  </div>
  <div class="info" id="info"></div>
</div>
</aside>
<div id="stage"><div id="wrap"><div class="h" id="hl" style="left:-20px" aria-label="Drag to change width"></div><div id="vp"></div><div class="h" id="hr" style="right:-20px" aria-label="Drag to change width"></div></div></div>
</div>
<script>
const $=s=>document.querySelector(s);
const svg=(a,b,c)=>'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="1600" height="1000" fill="url(#g)"/><path d="M0 1000V720L330 470 620 690 1040 330 1600 760V1000Z" fill="${c}"/><circle cx="800" cy="500" r="70" fill="none" stroke="#fff" stroke-width="10" opacity=".8"/><path d="M800 380V620M680 500H920" stroke="#fff" stroke-width="6" opacity=".8"/></svg>`);
const SB=svg('#9fb6cc','#e7edf3','#6f879d'),SS=svg('#cfd9c9','#f2efe4','#8aa08a');
const VS={primary:[{n:'Inset image: full width',h:600,k:'full'},{n:'Inset image: bg image',h:712,k:'inset'},{n:'Bg image: overlay',h:600,k:'ov'}],secondary:[{n:'Bg image',h:400,k:'bg'},{n:'Full width',h:400,k:'fw'}]};
const LB={eyebrow:'Eyebrow',lead:'Leading title',title:'Title',sub:'Subheading',desc:'Description',b1:'Primary button',b2:'Secondary button',foot:'Footnote'};
const DEFAULT_TEXT={eyebrow:'Eyebrow',lead:'Leading title',title:'Title',sub:'Subheading',desc:'Description',b1:'Label',b2:'Label',foot:'Footnote'};
const S={W:1280,g:'primary',v:0,bg:SB,side:SS,grid:false,ov:true,tcol:'auto',showSide:true,ts:'hero',show:{eyebrow:1,lead:1,title:1,sub:1,desc:1,b1:1,b2:1,foot:1},T:{...DEFAULT_TEXT},nav:{layout:'grid',logo:'assets/navigation-logo.png',showLogo:true,brandLabel:'alpha1-proteinase inhibitor (human)',showBrandLabel:true,showPrimary:true,showSecondary:false,menuOpen:false,items:[{label:'Nav Label 1',visible:true},{label:'Nav Label 2',visible:true},{label:'Nav Label 3',visible:true},{label:'Nav Label 4',visible:true},{label:'Nav Label 5',visible:true}]}};
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const escAttr=s=>esc(String(s)).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
let sc=1;
$('#sidebar-toggle').onclick=()=>{
  const collapsed=$('#app-shell').classList.toggle('sidebar-collapsed');
  $('#sidebar-toggle').setAttribute('aria-expanded',String(!collapsed));
  $('#sidebar-toggle').setAttribute('aria-label',collapsed?'Maximise controls':'Minimise controls');
  $('#sidebar-toggle').title=collapsed?'Maximise controls':'Minimise controls';
  requestAnimationFrame(render);
};
function setEditorTab(tab){
  const navigation=tab==='navigation';
  $('#header-controls').hidden=navigation;
  $('#navigation-controls').hidden=!navigation;
  $('#header-tab').setAttribute('aria-selected',String(!navigation));
  $('#navigation-tab').setAttribute('aria-selected',String(navigation));
  $('#header-tab').tabIndex=navigation?-1:0;
  $('#navigation-tab').tabIndex=navigation?0:-1;
  $('.sidebar-title').textContent=navigation?'Navigation controls':'Header controls';
}
$('#header-tab').onclick=()=>setEditorTab('header');
$('#navigation-tab').onclick=()=>setEditorTab('navigation');
document.querySelector('.editor-tabs').onkeydown=e=>{
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
    e.preventDefault();
    const tab=e.target.id==='navigation-tab'?'header':'navigation';
    setEditorTab(tab);
    $(`#${tab}-tab`).focus();
  }
};
function render(){
  const W=S.W,bp=W>=1800?'xl':W>=1280?'md':'sm',C=bp==='xl'?1440:bp==='sm'?912:W-128,L=(W-C)/2,col=(C-264)/12,sp=n=>n*col+(n-1)*24,
  v=VS[S.g][S.v],h=v.h,H=Math.max(h,1024),pri=S.g==='primary',k=v.k,light=!['full','inset'].includes(k),
  tc=S.tcol==='white'?'var(--light)':S.tcol==='black'?'var(--dark)':light?'var(--light)':'var(--dark)',imgL=L+7*(col+24),
  navH=W>=1280?80:64,navPadding=S.nav.layout==='grid'?L:W>=1280?Math.round(Math.max(48,Math.min(120,W*.05))):24;
  const e=(key,c,x)=>S.show[key]&&(pri||!['lead','foot','b1','b2'].includes(key))?`<div class="${c}" ${x||''} contenteditable data-k="${key}">${esc(S.T[key])}</div>`:'';
  const btn=e('b1','b b1')+e('b2','b b2');
  const ct=`<div class="ct" style="color:${tc}"><div class="stk">${e('eyebrow','e',`style="color:${S.tcol==='auto'?(light?'var(--light)':'var(--eye)'):tc}"`)}${e('lead','l')}${e('title','t'+(S.ts==='h1'?' h1':''))}${e('sub','s')}${e('desc','d')}</div>${btn?`<div class="btns">${btn}</div>`:''}${e('foot','f',`style="color:${S.tcol==='auto'?(light?'var(--light)':'var(--sub)'):tc}"`)}</div>`;
  const A=(l,w,p)=>`<div class="a" style="margin-left:${l}px;width:${w}px;min-height:${h}px;padding:${p}px 0">${ct}</div>`;
  const I=(st,u)=>`<div class="img" style="${st};background-image:url('${u}')"></div>`;
  const navLinks=S.nav.items.map((item,i)=>item.visible?`<span class="navigation-link" contenteditable data-nav-key="${i}">${esc(item.label)}</span>`:'').join('');
  const navMenu=S.nav.items.map(item=>item.visible?`<button class="navigation-menu-item" type="button">${esc(item.label)}</button>`:'').join('');
  const nav=`<div class="navigation" data-layout="${S.nav.layout}">
    <div class="navigation-inner" style="height:${navH}px;padding-inline:${navPadding}px">
      <div class="navigation-brand">${S.nav.showLogo?`<img class="navigation-logo" src="${escAttr(S.nav.logo)}" alt="Navigation logo">`:''}${S.nav.showBrandLabel?`<span class="navigation-brand-label" contenteditable data-nav-brand>${esc(S.nav.brandLabel)}</span>`:''}</div>
      <div class="navigation-links-area"><nav class="navigation-links" aria-label="Primary navigation">${navLinks}</nav></div>
      <div class="navigation-actions">${S.nav.showSecondary?'<button class="navigation-secondary" type="button">Secondary</button>':''}${S.nav.showPrimary?'<button class="navigation-primary" type="button">Primary</button>':''}<button class="navigation-menu-toggle" id="nav-menu-toggle" type="button" aria-label="Open navigation menu" aria-expanded="${S.nav.menuOpen}"><span class="navigation-menu-icon" aria-hidden="true"></span></button></div>
    </div>
    <div class="navigation-menu" id="nav-menu" ${S.nav.menuOpen?'':'hidden'}>${navMenu}</div>
  </div>`;
  let bgc='#fdfdff',inner='';
  if(k==='full')inner=I(`left:${imgL}px;right:0;top:0;bottom:0`,S.side)+A(L,sp(7),56);
  if(k==='inset'){bgc='var(--p300)';inner=I('inset:0',S.bg)+(S.showSide?I(`left:${imgL}px;width:${sp(5)}px;top:56px;bottom:56px`,S.side):'')+A(L,sp(6),56)}
  if(k==='ov'){inner=I('inset:0',S.bg)+(S.ov?'<div class="ov"></div>':'')+A(L,sp(8),80)}
  if(k==='bg'){inner=I('inset:0',S.bg)+(S.ov?'<div class="ov"></div>':'')+A(L+102,C-204,80)}
  if(k==='fw'){bgc='var(--p100)';inner=I(`left:${imgL}px;right:0;top:0;bottom:0`,S.side)+A(L+102,imgL-80-(L+102),80)}
  const grid=S.grid?`<div class="grid" style="left:${L}px;width:${C}px;bottom:0">${'<i></i>'.repeat(12)}</div>`:'';
  $('#vp').style.width=W+'px';
  $('#vp').innerHTML=`${nav}<div class="comp ${pri?'':'sec'}" style="min-height:${h}px;background:${bgc}">${inner}</div><div class="rest" style="flex:1">Rest of the page</div>${grid}`;
  const navRoot=$('.navigation'),navArea=$('.navigation-links-area'),navList=$('.navigation-links');
  const menuActive=S.nav.layout==='adaptive'&&navList.scrollWidth>navArea.clientWidth+1;
  navRoot.classList.toggle('is-menu',menuActive);
  if(!menuActive)S.nav.menuOpen=false;
  $('#nav-menu').hidden=!menuActive||!S.nav.menuOpen;
  $('#nav-menu-toggle').setAttribute('aria-expanded',String(menuActive&&S.nav.menuOpen));
  $('#nav-menu-toggle').setAttribute('aria-label',S.nav.menuOpen?'Close navigation menu':'Open navigation menu');
  $('#vp').style.minHeight='1024px';$('#sslab').style.display=k==='inset'?'':'none';
  sc=Math.min(1,($('#stage').clientWidth-48-40)/W);
  $('#vp').style.transform=`scale(${sc})`;
  $('#wrap').style.width=W*sc+'px';$('#wrap').style.height=$('#vp').offsetHeight*sc+'px';
  if(document.activeElement!==$('#w'))$('#w').value=Math.round(W);
  document.querySelectorAll('[data-w]').forEach(b=>b.setAttribute('aria-pressed',(+b.dataset.w>=1800?'xl':+b.dataset.w>=1280?'md':'sm')===bp));
  document.querySelectorAll('[data-nav-layout]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.navLayout===S.nav.layout));
  $('#info').textContent=`${Math.round(W)}px · ${{sm:'Small',md:'Medium',xl:'XL'}[bp]} · 12 columns · ${S.nav.layout} nav${menuActive?' menu':''} · ${h}px header · ${Math.round(sc*100)}% zoom`;
}
function fillVs(){$('#vs').innerHTML=VS[S.g].map((x,i)=>`<option value="${i}">${x.n}</option>`).join('');$('#vs').value=S.v}
$('#nav-items-editor').innerHTML=S.nav.items.map((item,i)=>`<div class="nav-item-row"><label class="nav-item-label">Item ${i+1}<input type="text" data-nav-label="${i}" value="${escAttr(item.label)}"></label><label><span>Show</span><input type="checkbox" data-nav-show="${i}" ${item.visible?'checked':''}></label></div>`).join('');
$('#tg').innerHTML=Object.keys(LB).map(k=>`<label><input type="checkbox" data-s="${k}" checked> ${LB[k]}</label>`).join('');
$('#tg').onchange=e=>{S.show[e.target.dataset.s]=e.target.checked?1:0;render()};
$('#gp').onclick=()=>{S.g='primary';S.v=0;setTs('hero');$('#gp').setAttribute('aria-pressed',true);$('#gs').setAttribute('aria-pressed',false);fillVs();render()};
$('#gs').onclick=()=>{S.g='secondary';S.v=0;setTs('h1');$('#gs').setAttribute('aria-pressed',true);$('#gp').setAttribute('aria-pressed',false);fillVs();render()};
$('#vs').onchange=e=>{S.v=+e.target.value;render()};
$('#w').oninput=e=>{const n=+e.target.value;if(n>=1008&&n<=2560){S.W=n;render()}};
$('#w').onchange=e=>{S.W=Math.min(2560,Math.max(1008,+e.target.value||1280));render()};
document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{S.W=+b.dataset.w;render()});
$('#grid').onchange=e=>{S.grid=e.target.checked;render()};
$('#ov').onchange=e=>{S.ov=e.target.checked;render()};
$('#ss').onchange=e=>{S.showSide=e.target.checked;render()};
function setTs(x){S.ts=x;document.querySelectorAll('[data-ts]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.ts===x))}
document.querySelectorAll('[data-ts]').forEach(b=>b.onclick=()=>{setTs(b.dataset.ts);render()});
document.querySelectorAll('[data-tc]').forEach(b=>b.onclick=()=>{S.tcol=b.dataset.tc;document.querySelectorAll('[data-tc]').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});
$('#fb').onchange=e=>{if(e.target.files[0]){S.bg=URL.createObjectURL(e.target.files[0]);render()}};
$('#fs').onchange=e=>{if(e.target.files[0]){S.side=URL.createObjectURL(e.target.files[0]);render()}};
$('#reset-all').onclick=()=>{
  Object.assign(S.T,DEFAULT_TEXT);
  S.bg=SB;
  S.side=SS;
  S.W=1280;
  $('#fb').value='';
  $('#fs').value='';
  render();
};
document.querySelectorAll('[data-nav-layout]').forEach(b=>b.onclick=()=>{S.nav.layout=b.dataset.navLayout;S.nav.menuOpen=false;render()});
$('#nav-logo-upload').onchange=e=>{
  if(e.target.files[0]){
    if(S.nav.logoObjectUrl)URL.revokeObjectURL(S.nav.logoObjectUrl);
    S.nav.logoObjectUrl=URL.createObjectURL(e.target.files[0]);
    S.nav.logo=S.nav.logoObjectUrl;
    render();
  }
};
$('#nav-logo-visible').onchange=e=>{S.nav.showLogo=e.target.checked;render()};
$('#nav-brand-label').oninput=e=>{S.nav.brandLabel=e.target.value;render()};
$('#nav-brand-visible').onchange=e=>{S.nav.showBrandLabel=e.target.checked;render()};
$('#nav-primary-visible').onchange=e=>{S.nav.showPrimary=e.target.checked;render()};
$('#nav-secondary-visible').onchange=e=>{S.nav.showSecondary=e.target.checked;render()};
$('#nav-items-editor').oninput=e=>{
  const i=Number(e.target.dataset.navLabel);
  if(Number.isInteger(i)&&S.nav.items[i]){S.nav.items[i].label=e.target.value;render()}
};
$('#nav-items-editor').onchange=e=>{
  const i=Number(e.target.dataset.navShow);
  if(Number.isInteger(i)&&S.nav.items[i]){S.nav.items[i].visible=e.target.checked;render()}
};
$('#vp').addEventListener('input',e=>{
  const k=e.target.dataset.k;
  if(k)S.T[k]=e.target.textContent;
  const navKey=e.target.dataset.navKey;
  if(navKey!==undefined){
    S.nav.items[+navKey].label=e.target.textContent;
    $(`[data-nav-label="${navKey}"]`).value=e.target.textContent;
  }
  if(e.target.dataset.navBrand!==undefined){
    S.nav.brandLabel=e.target.textContent;
    $('#nav-brand-label').value=e.target.textContent;
  }
});
$('#vp').addEventListener('click',e=>{
  if(e.target.closest('#nav-menu-toggle')){S.nav.menuOpen=!S.nav.menuOpen;render()}
});
let dr=null;
[['#hl',-1],['#hr',1]].forEach(([id,d])=>{const el=$(id);
  el.addEventListener('pointerdown',e=>{dr={x:e.clientX,w:S.W,d};el.setPointerCapture(e.pointerId)});
  el.addEventListener('pointermove',e=>{if(!dr)return;S.W=Math.round(Math.min(2560,Math.max(1008,dr.w+2*dr.d*(e.clientX-dr.x)/sc)));render()});
  el.addEventListener('pointerup',()=>dr=null)});
addEventListener('resize',render);
fillVs();render();
</script>
</body>
</html>
